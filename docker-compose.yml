version: '3.8'

services:
  db:
    image: mongo:latest
    container_name: t20_db
    ports:
      - "27017:27017"
    volumes:
      - ./data/db:/data/db

  api:
    build: ./app
    container_name: t20_api
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - MONGO_URI=mongodb://db:27017/tormenta20
    volumes:
      - ./app:/app
